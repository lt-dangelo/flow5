name: Generate opaque Pick5Go home-screen preview icons
on:
  push:
    branches: [fix/opaque-homescreen-preview-20261029]
    paths:
      - 'scripts/generate-home-screen-icons.py'
      - '.github/workflows/generate-home-screen-icons.yml'

permissions:
  contents: write

jobs:
  generate-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image rendering dependencies
        run: python -m pip install --disable-pip-version-check pillow cairosvg
      - name: Render and verify opaque icon assets
        run: python scripts/generate-home-screen-icons.py
      - name: Commit generated PNGs to preview feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/apple-touch-icon.png icons/home-192.png icons/home-512.png icons/home-maskable-512.png
          git diff --cached --quiet || (git commit -m "Render verified opaque home screen PNG icons" && git push)
