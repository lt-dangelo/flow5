name: Test Flow5
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test production workout logic
        run: npm test
      - name: Test v1.3 visual preview
        run: npm test --prefix preview/v1.3
