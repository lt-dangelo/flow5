<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8"/>
 <base href="../"/>
 <meta name="viewport" content="width=device-width,initial-scale=1"/>
 <meta name="robots" content="noindex,follow"/>
 <meta name="theme-color" content="#0b1016"/>
 <meta name="description" content="Explore short, beginner-friendly bodyweight workouts for strength and stability. Start instantly with Pick5Go — no signup."/>
 <link rel="stylesheet" href="./styles.css?build=1.3.42"/>
 <link rel="icon" href="./icons/pick5go-mark.svg" type="image/svg+xml"/>
 <title>Ready-to-use bodyweight workouts | Pick5Go Preview</title>
 <style>
 .gallery-shell{max-width:1100px;margin:auto;padding:24px clamp(16px,4vw,40px) 54px;color:var(--text)}
 .gallery-nav{display:flex;justify-content:space-between;align-items:center;gap:14px;border-bottom:1px solid var(--outline);padding-bottom:22px}
 .gallery-nav img{width:76px;height:auto}
 .gallery-nav a{color:var(--lime);font-weight:700;font-size:13px}
 .gallery-intro{padding:35px 0 20px;max-width:760px}
 .gallery-intro h1{font-size:clamp(29px,5vw,54px);letter-spacing:-.04em;margin:0 0 12px}
 .gallery-intro p{color:var(--muted);line-height:1.7;font-size:15px}
 .gallery-controls{display:flex;flex-wrap:wrap;align-items:end;gap:12px;margin:18px 0 25px}
 .gallery-controls label{display:flex;flex-direction:column;gap:7px;color:var(--muted);font-size:12px;font-weight:700}
 .gallery-controls select{min-width:148px;color:var(--text);background:var(--panel2);border:1px solid var(--outline);border-radius:10px;padding:11px;font-size:13px}
 .gallery-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
 .gallery-card{border:1px solid var(--outline);border-radius:17px;background:var(--panel);padding:20px;display:flex;flex-direction:column;gap:12px}
 .gallery-card h2{font-size:19px;letter-spacing:-.02em;line-height:1.35}
 .gallery-card p{font-size:13px;color:var(--muted);line-height:1.65;flex:1}
 .gallery-card .meta{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--lime);font-weight:700}
 .gallery-card a{display:block;text-align:center;background:var(--lime);color:#182c19;border-radius:10px;padding:12px 15px;font-size:13px;font-weight:850}
 .gallery-card a:hover{filter:brightness(1.06)}
 .gallery-disclaimer{font-size:12px;color:var(--muted);max-width:790px;line-height:1.7;margin:28px 0}
 .gallery-footer{border-top:1px solid var(--outline);padding-top:18px;font-size:12px;color:var(--muted)}
 .gallery-footer a{color:var(--lime)}
 </style>
</head>
<body>
 <main class="gallery-shell">
 <nav class="gallery-nav"><img src="./icons/pick5go-mark.svg" alt="Pick5Go"/><a id="gallery-back" href="./">← Back to builder</a></nav>
 <section class="gallery-intro"><h1 id="gallery-title">Find your workout</h1><p id="gallery-description">Pick a goal and level, then customize any exercise or interval. No registration required.</p></section>
 <section class="gallery-controls" aria-label="Filter example workouts"><label><span id="goal-label">Focus</span><select id="gallery-goal"></select></label><label><span id="level-label">Level</span><select id="gallery-level"></select></label><label><span id="lang-label">Language</span><select id="gallery-lang"></select></label></section>
 <section class="gallery-list" id="gallery-list"></section>
 <p class="gallery-disclaimer" id="gallery-note"></p>
 <footer class="gallery-footer"><a id="gallery-footer-link" href="./">Pick5Go</a> · <span id="gallery-footer-note">Free, offline-capable, no account.</span></footer>
 </main>
 <script type="module" src="./src/gallery.js?build=1.3.42"></script>
</body>
</html>
